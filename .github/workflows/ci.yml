name: LashApp CI

on:
  push:
    branches:
      - main
      - refactor/revisao-tecnica
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lashapp-backend/lashapp
    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TIME_ZONE: America/Sao_Paulo
      PRIVATE_MEDIA_ROOT: ${{ github.workspace }}/private_media
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: no-reply@lashapp.local
      EMAIL_HOST: localhost
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      FRONTEND_URL: http://localhost:5173
      SUPPORT_WHATSAPP_NUMBER: "5541984541254"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: lashapp-backend/lashapp/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Run Django system check
        run: python manage.py check

      - name: Run test suite with coverage
        run: coverage run manage.py test -v 2

      - name: Report coverage
        run: coverage report
