version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: calash_db
      POSTGRES_USER: calash_user
      POSTGRES_PASSWORD: calash_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://calash_user:calash_pass@db:5432/calash_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Evita sobrescrever a pasta node_modules do container
      - /app/node_modules 
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: