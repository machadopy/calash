version: '3.8'

services:
  backend:
    build: ./lashapp-backend
    command: gunicorn lashapp.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      # Mapeia a pasta do backend para o container
      - ./lashapp-backend:/app
      # Esta linha é OBRIGATÓRIA para não perder os dados do banco a cada build
      - ./lashapp-backend/db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend